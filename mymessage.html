<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MyMessage Programm</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f0f1a, #1a0033);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .chat-container {
        background: #12121e;
        padding: 20px;
        border-radius: 20px;
        width: 400px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      }
      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .chat-header h2 {
        margin: 0;
        font-size: 20px;
      }
      .chat-box {
        background: #1d1d2b;
        border-radius: 10px;
        height: 300px;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 10px;
      }
      .message {
        margin: 5px 0;
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 15px;
        word-wrap: break-word;
      }
      .you {
        background: #0057ff;
        margin-left: auto;
        text-align: right;
      }
      .contact {
        background: #333;
        margin-right: auto;
      }
      .chat-input {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      input,
      button {
        border: none;
        outline: none;
        border-radius: 8px;
        padding: 8px;
      }
      input[type="text"] {
        flex: 1;
        background: #1d1d2b;
        color: white;
      }
      button {
        background: #0057ff;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #0074ff;
      }
      .call-btn {
        background: green;
      }
      .end-btn {
        background: red;
      }
      img {
        max-width: 150px;
        border-radius: 10px;
        margin-top: 5px;
      }
      .top-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        margin-bottom: 10px;
      }
      .calling {
        text-align: center;
        color: cyan;
        animation: blink 1s infinite alternate;
      }
      @keyframes blink {
        from {
          opacity: 0.4;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h2>💬 MyMessage Programm</h2>
        <div>
          <button class="call-btn" id="callBtn">📞 Call</button>
          <button class="end-btn" id="endBtn" style="display: none">
            🔴 End
          </button>
        </div>
      </div>

      <div class="top-inputs">
        <input id="myName" placeholder="Your Name" />
        <input id="myNumber" placeholder="Your Number" />
        <input id="contactName" placeholder="Contact Name" />
        <input id="contactNumber" placeholder="Contact Number" />
      </div>

      <div class="calling" id="callingText"></div>

      <div class="chat-box" id="chatBox"></div>

      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Type a message..." />
        <input type="file" id="imgInput" accept="image/*" />
        <button id="sendBtn">➤</button>
      </div>
    </div>

    <script>
      const msgInput = document.getElementById("msgInput");
      const imgInput = document.getElementById("imgInput");
      const chatBox = document.getElementById("chatBox");
      const sendBtn = document.getElementById("sendBtn");
      const callBtn = document.getElementById("callBtn");
      const endBtn = document.getElementById("endBtn");
      const callingText = document.getElementById("callingText");
      const myName = document.getElementById("myName");
      const contactName = document.getElementById("contactName");

      let audio;
      const sciFiSound =
        "https://cdn.pixabay.com/download/audio/2022/03/15/audio_856f24ed88.mp3?filename=sci-fi-alarm-94966.mp3";

      // Load saved messages
      let messages = JSON.parse(localStorage.getItem("messages") || "[]");
      renderMessages();

      sendBtn.onclick = () => {
        const text = msgInput.value.trim();
        if (!text && !imgInput.files.length) return;

        const reader = new FileReader();
        reader.onload = () => {
          const msg = {
            sender: myName.value || "You",
            text,
            image: reader.result || null,
          };
          messages.push(msg);
          saveAndRender();
        };
        if (imgInput.files[0]) {
          reader.readAsDataURL(imgInput.files[0]);
        } else {
          const msg = {
            sender: myName.value || "You",
            text,
            image: null,
          };
          messages.push(msg);
          saveAndRender();
        }
        msgInput.value = "";
        imgInput.value = "";
      };

      function saveAndRender() {
        localStorage.setItem("messages", JSON.stringify(messages));
        renderMessages();
      }

      function renderMessages() {
        chatBox.innerHTML = "";
        messages.forEach((msg) => {
          const div = document.createElement("div");
          div.className =
            "message " + (msg.sender === (myName.value || "You") ? "you" : "contact");
          div.innerHTML = `<b>${msg.sender}:</b> ${
            msg.text || ""
          } ${msg.image ? `<br><img src="${msg.image}">` : ""}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      callBtn.onclick = () => {
        callingText.textContent =
          "📡 Calling " + (contactName.value || "Contact") + "...";
        callBtn.style.display = "none";
        endBtn.style.display = "inline-block";
        audio = new Audio(sciFiSound);
        audio.loop = true;
        audio.play();
      };

      endBtn.onclick = () => {
        callingText.textContent = "";
        callBtn.style.display = "inline-block";
        endBtn.style.display = "none";
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
        }
      };
    </script>
  </body>
</html>
